# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - boost%intel@2021.6.0
  - eccodes%intel@2021.6.0 +aec+fortran~memfs+netcdf+openmp+png~pthreads~python+tools
    jp2k=jasper build_type=Release
  - fftw%intel@2021.6.0 ^intel-oneapi-mpi
  - hdf5%intel@2021.6.0 ^intel-oneapi-mpi
  - parallel-netcdf%intel@2021.6.0 ^intel-oneapi-mpi
  - mumps%intel@2021.6.0 ^intel-oneapi-mkl ^intel-oneapi-mpi
  - netcdf-c%intel@2021.6.0
  - netcdf-fortran%intel@2021.6.0
  view: false
  packages:
    all:
      compiler: [intel@2021.6.0]
      target: [cascadelake]
      providers:
        mpi: [intel-oneapi-mpi]
        blas: [intel-oneapi-mkl]
        lapack: [intel-oneapi-mkl]
        scalapack: [intel-oneapi-mkl]
    boost:
      variants: +context+container+coroutine+fibber+icu+mpi cxxstd=17
    cdo:
      variants: +curl
    eccodes:
      variants: +aec+fortran+memfs+netcdf+openmp+png~pthreads~python+tools jp2k=jasper
        build_type=Release
    fftw:
      variants: +mpi
    hdf:
      variants: ~external-xdr+shared+szip
    hdf5:
      variants: +threadsafe+szip+fortran+cxx+hl+mpi+tools
    mumps:
      variants: +ptscotch
    netcdf-c:
      variants: +dap~fsync+hdf4~jna+mpi+parallel-netcdf+pic+shared
    python:
      variants: +tls
  concretizer:
    unify: when_possible
